  <link

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(to bottom, #000, #ff4fa3);
      color: white;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 100px;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 40px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      transition: 0.3s;
    }

    nav ul li a:hover {
      color: #ff4fa3;
    }

    .contact-section {
      text-align: center;
      padding: 120px 0;
    }

    .contact-section h2 {
      font-size: 40px;
      margin-bottom: 30px;
    }

    .contact-section p {
      font-size: 20px;
      margin-bottom: 40px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 40px;
    }

    .social-icons a {
      color: white;
      font-size: 40px;
      transition: 0.3s;
      text-decoration: none;
    }

    .social-icons a:hover {
      color: #ff4fa3;
      transform: scale(1.2);
    }
  </style>
</head>
